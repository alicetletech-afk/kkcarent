<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KK Car Schedule</title>
  <style>
    :root{--ink:#173a35;--muted:#69827d;--teal:#16967f;--mint:#dff7ef;--pink:#ffe0e8;--yellow:#fff2b8;--blue:#ddecff;--purple:#eee2ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#ebfbf7,#e8f2ff);color:var(--ink);font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{width:min(760px,100%);margin:auto;padding:28px 20px 50px}.nav{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:800}.nav a{background:#fff;color:#177763;font-weight:800;text-decoration:none;padding:11px 15px;border-radius:14px;box-shadow:0 8px 20px #1a514015}h1{font-size:clamp(28px,5vw,38px);margin:28px 0 6px}.intro{color:var(--muted);margin:0 0 22px}.card{background:#fff;border-radius:24px;padding:21px;margin:16px 0;box-shadow:0 12px 34px #194c4014}h2{margin:0 0 14px;font-size:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px}.choice{width:100%;border:2px solid #e4efed;background:#fff;border-radius:17px;padding:14px;color:var(--ink);text-align:left;font:inherit;cursor:pointer}.choice.active{border-color:var(--teal);background:var(--mint);box-shadow:0 4px 12px #149b8130}.choice small{display:block;margin-top:5px;color:var(--muted)}.status[data-status="ลูกค้าจอง"]{background:var(--pink)}.status[data-status="รอยืนยัน"]{background:var(--yellow)}.status[data-status="ใช้ส่วนตัว"]{background:var(--blue)}.status[data-status="เข้าอู่ / ซ่อม"]{background:var(--purple)}label{display:block;font-size:14px;font-weight:800;margin-top:14px}input,textarea{display:block;width:100%;margin-top:6px;padding:13px;border:1px solid #d9e7e4;border-radius:14px;font:inherit;color:var(--ink);background:#fcfefd}.dates{display:grid;grid-template-columns:1fr 1fr;gap:12px}.toggle{display:flex;align-items:center;gap:9px;background:#edf8f5;padding:12px;border-radius:14px;cursor:pointer}.toggle input{width:20px;height:20px;margin:0;accent-color:var(--teal)}.save{width:100%;border:0;border-radius:16px;padding:16px;margin-top:20px;background:var(--teal);color:#fff;font:inherit;font-weight:800;font-size:17px;cursor:pointer}.modal{position:fixed;inset:0;display:none;place-items:center;padding:18px;background:#10231d88}.modal.show{display:grid}.modal article{width:min(480px,100%);padding:28px;border-radius:26px;background:#fff;text-align:center}.modal h2{font-size:25px;margin:10px 0 8px}.modal p{color:var(--muted);line-height:1.6}.modal a,.modal button{display:block;width:100%;border:0;border-radius:15px;padding:14px;margin-top:10px;font:inherit;font-weight:800;text-decoration:none;cursor:pointer}.modal a{background:var(--teal);color:#fff}.modal button{background:#eaf6f3;color:#167b69}@media(max-width:460px){.dates{grid-template-columns:1fr}main{padding:22px 16px 40px}}
  </style>
</head>
<body>
  <main>
    <nav class="nav"><div class="brand">🚙 KK Car Schedule</div><a href="schedule.html">ดูตารางรถ →</a></nav>
    <h1>เพิ่มสถานะรถ</h1><p class="intro">เลือกทะเบียน สถานะ วันและเวลา แล้วตารางรถจะอัปเดตทันที</p>
    <form id="form">
      <section class="card"><h2>1. เลือกรถ</h2><div class="grid" id="cars"></div></section>
      <section class="card"><h2>2. เลือกสถานะ</h2><div class="grid"><button type="button" class="choice status" data-status="ลูกค้าจอง">🩷 ลูกค้าจอง</button><button type="button" class="choice status" data-status="รอยืนยัน">💛 รอยืนยัน</button><button type="button" class="choice status" data-status="ใช้ส่วนตัว">💙 ใช้ส่วนตัว</button><button type="button" class="choice status" data-status="เข้าอู่ / ซ่อม">💜 เข้าอู่ / ซ่อม</button></div></section>
      <section class="card"><h2>3. วันและเวลา</h2><label class="toggle"><input id="allDay" type="checkbox" checked> ไม่ว่างทั้งวัน</label><div class="dates"><label>เริ่ม<input id="startDate" type="date" required></label><label>สิ้นสุด<input id="endDate" type="date" required></label></div><div class="dates" id="timeFields" hidden><label>เวลาเริ่ม<input id="startTime" type="time" value="08:00"></label><label>เวลาสิ้นสุด<input id="endTime" type="time" value="18:00"></label></div><label>หมายเหตุ <span style="font-weight:500;color:#78908b">(ไม่บังคับ)</span><textarea id="note" rows="2" placeholder="ชื่อลูกค้า / งาน / รายละเอียด"></textarea></label><button class="save">บันทึกสถานะรถ</button></section>
    </form>
  </main>
  <div class="modal" id="modal"><article><div style="font-size:48px">✅</div><h2>บันทึกเรียบร้อย</h2><p id="summary"></p><a href="schedule.html">ดูตารางรถทั้งหมด</a><button type="button" id="again">เพิ่มรายการต่อ</button></article></div>
  <script>
    const cars=[['ativ2017','กข 1234','Yaris Ativ 2017'],['ativ2019','ขค 5678','Yaris Ativ 2019'],['ativ2021','งจ 9012','Yaris Ativ 2021'],['ativ2022','ฉช 2468','Yaris Ativ 2022'],['yaris2025','ญษ 5555','Yaris All New 2025']];let selectedCar='',selectedStatus='';const $=s=>document.querySelector(s),today=new Date().toISOString().slice(0,10);const readEvents=()=>{try{return JSON.parse(localStorage.getItem('kk-car-events')||'[]')}catch(error){try{return JSON.parse(window.name||'[]')}catch(ignore){return []}}},writeEvents=list=>{try{localStorage.setItem('kk-car-events',JSON.stringify(list))}catch(error){window.name=JSON.stringify(list)}};$('#startDate').value=$('#endDate').value=today;$('#cars').innerHTML=cars.map(c=>`<button type="button" class="choice car" data-id="${c[0]}">🚗 ${c[1]}<small>${c[2]}</small></button>`).join('');const select=(el,s)=>{document.querySelectorAll(s).forEach(x=>x.classList.remove('active'));el.classList.add('active')};document.querySelectorAll('.car').forEach(b=>b.onclick=()=>{selectedCar=b.dataset.id;select(b,'.car')});document.querySelectorAll('.status').forEach(b=>b.onclick=()=>{selectedStatus=b.dataset.status;select(b,'.status')});$('#allDay').onchange=e=>$('#timeFields').hidden=e.target.checked;const dateText=v=>new Date(v+'T00:00:00').toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'});$('#form').onsubmit=e=>{e.preventDefault();if(!selectedCar||!selectedStatus)return alert('กรุณาเลือกรถและสถานะ');const item={id:crypto.randomUUID(),carId:selectedCar,status:selectedStatus,startDate:$('#startDate').value,endDate:$('#endDate').value,allDay:$('#allDay').checked,startTime:$('#startTime').value,endTime:$('#endTime').value,note:$('#note').value,source:'manual',active:true};const list=readEvents();list.push(item);writeEvents(list);const car=cars.find(c=>c[0]===selectedCar);$('#summary').textContent=`${car[1]} · ${selectedStatus} · ${dateText(item.startDate)}${item.endDate!==item.startDate?' ถึง '+dateText(item.endDate):''}`;$('#modal').classList.add('show')};$('#again').onclick=()=>{location.reload()};
  </script>
</body>
</html>
