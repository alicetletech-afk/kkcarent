<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
   <link rel="icon" type="image/svg+xml"
  href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23CBF7EA'/%3E%3Cpath d='M13 36.5c0-2.5 2-4.5 4.5-4.5h2.1l3.4-10.1c.5-1.5 1.9-2.4 3.5-2.4h11c1.6 0 3 .9 3.5 2.4L45.4 32h1.1c2.5 0 4.5 2 4.5 4.5V42c0 1.7-1.3 3-3 3h-2.2a5.8 5.8 0 0 1-11.3 0H29.4a5.8 5.8 0 0 1-11.3 0H16c-1.7 0-3-1.3-3-3v-5.5Z' fill='%23178E7A'/%3E%3Cpath d='m25.7 23.5-2.8 8.5h18.3l-2.9-8.5H25.7Z' fill='white'/%3E%3Ccircle cx='23.8' cy='43' r='3.3' fill='white'/%3E%3Ccircle cx='40.2' cy='43' r='3.3' fill='white'/%3E%3C/svg%3E">

  <title>KK Car Schedule</title>
  <title>KK Car Schedule</title>
  <style>
  
:root{--ink:#173a35;--muted:#69827d;--teal:#16967f;--mint:#dff7ef;--pink:#ffe0e8;--yellow:#fff2b8;--blue:#ddecff;--purple:#eee2ff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(135deg,#ebfbf7,#e8f2ff);color:var(--ink);font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
a{color:inherit}

  main{width:min(760px,100%);margin:auto;padding:28px 20px 50px}
  .nav{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .brand{font-weight:800}
  .nav a{background:#fff;color:#177763;font-weight:800;text-decoration:none;padding:11px 15px;border-radius:14px;box-shadow:0 8px 20px #1a514015}
  h1{font-size:clamp(28px,5vw,38px);margin:28px 0 6px}
  .intro{color:var(--muted);margin:0 0 22px}
  .card{background:#fff;border-radius:24px;padding:21px;margin:16px 0;box-shadow:0 12px 34px #194c4014}
  h2{margin:0 0 14px;font-size:18px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px}
  .choice{width:100%;border:2px solid #e4efed;background:#fff;border-radius:17px;padding:14px;color:var(--ink);text-align:left;font:inherit;cursor:pointer}
  .choice.active{border-color:var(--teal);background:var(--mint);box-shadow:0 4px 12px #149b8130}
  .choice small{display:block;margin-top:5px;color:var(--muted)}
  .status[data-status="ลูกค้าจอง"]{background:var(--pink)}
  .status[data-status="รอยืนยัน"]{background:var(--yellow)}
  .status[data-status="ใช้ส่วนตัว"]{background:var(--blue)}
  .status[data-status="เข้าอู่ / ซ่อม"]{background:var(--purple)}
  label{display:block;font-size:14px;font-weight:800;margin-top:14px}
  input,textarea{display:block;width:100%;margin-top:6px;padding:13px;border:1px solid #d9e7e4;border-radius:14px;font:inherit;color:var(--ink);background:#fcfefd}
  .dates{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .toggle{display:flex;align-items:center;gap:9px;background:#edf8f5;padding:12px;border-radius:14px;cursor:pointer}
  .toggle input{width:20px;height:20px;margin:0;accent-color:var(--teal)}
  .save{width:100%;border:0;border-radius:16px;padding:16px;margin-top:20px;background:var(--teal);color:#fff;font:inherit;font-weight:800;font-size:17px;cursor:pointer}
  .save:disabled{opacity:.65}
  .modal{position:fixed;inset:0;display:none;place-items:center;padding:18px;background:#10231d88}
  .modal.show{display:grid}
  .modal article{width:min(480px,100%);padding:28px;border-radius:26px;background:#fff;text-align:center}
  .modal h2{font-size:25px;margin:10px 0 8px}
  .modal p{color:var(--muted);line-height:1.6}
  .modal a,.modal button{display:block;width:100%;border:0;border-radius:15px;padding:14px;margin-top:10px;font:inherit;font-weight:800;text-decoration:none;cursor:pointer}
  .modal a{background:var(--teal);color:#fff}
  .modal button{background:#eaf6f3;color:#167b69}
  .loading{padding:16px;color:var(--muted)}
  @media(max-width:460px){.dates{grid-template-columns:1fr}main{padding:22px 16px 40px}}
  </style>
</head>
<body>
<main>
  <nav class="nav">
    <div class="brand">🚙 KK Car Schedule</div>
    <a href="schedule.html">ดูตารางรถ →</a>
  </nav>

  <h1>เพิ่มสถานะรถ</h1>
  <p class="intro">เลือกทะเบียน สถานะ วันและเวลา แล้วตารางรถจะอัปเดตทันที</p>

  <form id="form">
    <section class="card">
      <h2>1. เลือกรถ</h2>
      <div class="grid" id="cars"><div class="loading">กำลังโหลดรถ...</div></div>
    </section>

    <section class="card">
      <h2>2. เลือกสถานะ</h2>
      <div class="grid">
        <button type="button" class="choice status" data-status="ลูกค้าจอง">🩷 ลูกค้าจอง</button>
        <button type="button" class="choice status" data-status="รอยืนยัน">💛 รอยืนยัน</button>
        <button type="button" class="choice status" data-status="ใช้ส่วนตัว">💙 ใช้ส่วนตัว</button>
        <button type="button" class="choice status" data-status="เข้าอู่ / ซ่อม">💜 เข้าอู่ / ซ่อม</button>
      </div>
    </section>

    <section class="card">
      <h2>3. วันและเวลา</h2>

      <label class="toggle">
        <input id="allDay" type="checkbox" checked>
        ไม่ว่างทั้งวัน
      </label>

      <div class="dates">
        <label>เริ่ม
          <input id="startDate" type="date" required>
        </label>
        <label>สิ้นสุด
          <input id="endDate" type="date" required>
        </label>
      </div>

      <div class="dates" id="timeFields" hidden>
        <label>เวลาเริ่ม
          <input id="startTime" type="time" value="08:00">
        </label>
        <label>เวลาสิ้นสุด
          <input id="endTime" type="time" value="18:00">
        </label>
      </div>

      <label>หมายเหตุ <span style="font-weight:500;color:#78908b">(ไม่บังคับ)</span>
        <textarea id="note" rows="2" placeholder="ชื่อลูกค้า / งาน / รายละเอียด"></textarea>
      </label>

      <button class="save" id="save">บันทึกสถานะรถ</button>
    </section>
  </form>
</main>

<div class="modal" id="modal">
  <article>
    <div style="font-size:48px">✅</div>
    <h2>บันทึกเรียบร้อย</h2>
    <p id="summary"></p>
    <a href="schedule.html">ดูตารางรถทั้งหมด</a>
    <button type="button" id="again">เพิ่มรายการต่อ</button>
  </article>
</div>

<script>

const API_URL = 'https://script.google.com/macros/s/AKfycbzb-ZtwopacvCf2KivTTj23bj1u2dh4PTo7BT92wiLGlO-mhOkWk9PBip5YYASBbJc4MQ/exec';

function apiCall(params) {
  return new Promise((resolve, reject) => {
    const callbackName =
      '__kkcb_' + Date.now() + '_' + Math.random().toString(36).slice(2);

    const timeout = setTimeout(() => {
      cleanup();
      reject(new Error('เชื่อมต่อระบบไม่สำเร็จ กรุณาลองใหม่'));
    }, 20000);

    function cleanup() {
      clearTimeout(timeout);
      delete window[callbackName];
      if (script.parentNode) script.parentNode.removeChild(script);
    }

    window[callbackName] = function (response) {
      cleanup();

      if (!response || response.ok === false) {
        reject(new Error(
          response && response.error
            ? response.error
            : 'เกิดข้อผิดพลาด'
        ));
        return;
      }

      resolve(response);
    };

    const query = new URLSearchParams({
      ...params,
      callback: callbackName,
      _: String(Date.now())
    });

    const script = document.createElement('script');
    script.src = API_URL + '?' + query.toString();
    script.onerror = function () {
      cleanup();
      reject(new Error('โหลดข้อมูลไม่สำเร็จ'));
    };

    document.body.appendChild(script);
  });
}


const $ = selector => document.querySelector(selector);
let cars = [];
let selectedCar = '';
let selectedStatus = '';

const today = new Date().toISOString().slice(0, 10);
$('#startDate').value = today;
$('#endDate').value = today;

function pick(element, selector) {
  document.querySelectorAll(selector).forEach(item => item.classList.remove('active'));
  element.classList.add('active');
}

function fail(error) {
  alert(error && error.message ? error.message : String(error || 'เกิดข้อผิดพลาด'));
}

function setup(data) {
  cars = data.cars || [];

  $('#cars').innerHTML = cars.length
    ? cars.map(car => `
        <button type="button" class="choice car" data-id="${escapeHtml(car.id)}">
          🚗 ${escapeHtml(car.label)}
          <small>${escapeHtml(car.id)}</small>
        </button>
      `).join('')
    : '<div class="loading">ยังไม่มีข้อมูลรถในชีต Cars</div>';

  document.querySelectorAll('.car').forEach(button => {
    button.onclick = () => {
      selectedCar = button.dataset.id;
      pick(button, '.car');
    };
  });

  document.querySelectorAll('.status').forEach(button => {
    button.onclick = () => {
      selectedStatus = button.dataset.status;
      pick(button, '.status');
    };
  });
}

$('#allDay').onchange = event => {
  $('#timeFields').hidden = event.target.checked;
};

$('#startDate').onchange = () => {
  if (!$('#endDate').value || $('#endDate').value < $('#startDate').value) {
    $('#endDate').value = $('#startDate').value;
  }
};

$('#form').onsubmit = async event => {
  event.preventDefault();

  if (!selectedCar || !selectedStatus) {
    alert('กรุณาเลือกรถและสถานะ');
    return;
  }

  const button = $('#save');
  button.disabled = true;
  button.textContent = 'กำลังบันทึก…';

  try {
    await apiCall({
      action: 'save',
      carId: selectedCar,
      status: selectedStatus,
      startDate: $('#startDate').value,
      endDate: $('#endDate').value,
      startTime: $('#startTime').value,
      endTime: $('#endTime').value,
      allDay: String($('#allDay').checked),
      note: $('#note').value
    });

    const car = cars.find(item => item.id === selectedCar);
    $('#summary').textContent = `${car.label} · ${selectedStatus}`;
    $('#modal').classList.add('show');
  } catch (error) {
    fail(error);
  } finally {
    button.disabled = false;
    button.textContent = 'บันทึกสถานะรถ';
  }
};

$('#again').onclick = () => location.reload();

function escapeHtml(value) {
  return String(value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

apiCall({ action: 'initial' })
  .then(setup)
  .catch(fail);
</script>
</body>
</html>
