<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="0; url=https://script.google.com/macros/s/AKfycbzb-ZtwopacvCf2KivTTj23bj1u2dh4PTo7BT92wiLGlO-mhOkWk9PBip5YYASBbJc4MQ/exec?page=schedule">
  <title>KK Car Schedule — ตารางรถ</title>
  <style>
    :root{--ink:#173a35;--muted:#69827d;--teal:#16967f;--pink:#f8a7b8;--yellow:#f7d657;--blue:#8fc7ff;--purple:#c7a6ff;--green:#bcefd7}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#ebfbf7,#e8f2ff);color:var(--ink);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:1180px;margin:auto;padding:26px 22px 50px}.nav{display:flex;justify-content:space-between;align-items:center;gap:14px}.brand{font-size:18px;font-weight:850}.nav a{background:#fff;color:#177763;font-weight:800;text-decoration:none;padding:11px 15px;border-radius:14px;box-shadow:0 8px 20px #1a514015}h1{font-size:30px;margin:26px 0 5px}.intro{margin:0 0 18px;color:var(--muted)}.bar{background:#fff;padding:14px;border-radius:20px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 12px 34px #194c4014}.bar button{border:0;background:#eaf7f3;color:#167b69;padding:10px 13px;border-radius:12px;font:inherit;font-weight:800;cursor:pointer}.range{font-weight:800;text-align:center}.legend{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0}.tag{padding:7px 10px;border-radius:99px;font-weight:750;font-size:13px}.pink{background:#ffe0e8}.yellow{background:#fff2b8}.blue{background:#ddecff}.purple{background:#eee2ff}.green{background:#dff7ef}.table-wrap{overflow:auto;background:#fff;border-radius:24px;box-shadow:0 12px 34px #194c4014}.timeline{min-width:940px;display:grid;grid-template-columns:150px repeat(7,1fr);border-top:1px solid #e4efed;border-left:1px solid #e4efed}.head,.car,.day{min-height:100px;border-right:1px solid #e4efed;border-bottom:1px solid #e4efed;padding:12px}.head{background:#f7fcfb;font-weight:850;text-align:center}.head small{display:block;color:var(--muted);font-weight:600;margin-top:4px}.car{display:flex;align-items:center;gap:7px;font-weight:850;background:#fcfffe}.car small{display:block;color:var(--muted);font-weight:550}.day{padding:8px;background:linear-gradient(180deg,#fff,#fbfefd)}.free{display:block;color:#4b8676;font-size:12px;padding:7px 8px;border-radius:10px;background:#f0faf6}.event{display:block;width:100%;border:0;border-radius:11px;padding:8px;margin:0 0 6px;text-align:left;font:inherit;font-size:12px;color:#243b37;cursor:pointer}.event b{display:block}.event small{display:block;margin-top:3px;opacity:.78}.event[data-status="ลูกค้าจอง"],.event[data-status="ยืนยันแล้ว"],.event[data-status="รับรถแล้ว"]{background:var(--pink)}.event[data-status="รอยืนยัน"]{background:var(--yellow)}.event[data-status="ใช้ส่วนตัว"]{background:var(--blue)}.event[data-status="เข้าอู่ / ซ่อม"]{background:var(--purple)}.modal{position:fixed;inset:0;display:none;place-items:center;padding:18px;background:#10231d88}.modal.show{display:grid}.modal article{width:min(430px,100%);padding:26px;border-radius:25px;background:white}.modal h2{margin:0 0 10px}.modal p{color:var(--muted);line-height:1.55}.actions{display:flex;gap:10px;margin-top:18px}.actions button{flex:1;border:0;padding:12px;border-radius:13px;font:inherit;font-weight:800;cursor:pointer}.cancel{background:#fbe2e8;color:#a33f56}.close{background:#e9f6f2;color:#167b69}@media(max-width:560px){main{padding:22px 14px 35px}.bar{padding:11px}.range{font-size:14px}}
  </style>
</head>
<body>
  <main>
    <p class="intro">กำลังเปิดตารางรถจริง… <a href="https://script.google.com/macros/s/AKfycbzb-ZtwopacvCf2KivTTj23bj1u2dh4PTo7BT92wiLGlO-mhOkWk9PBip5YYASBbJc4MQ/exec?page=schedule">กดที่นี่หากหน้าไม่เปลี่ยน</a></p>
    <nav class="nav"><div class="brand">🚙 KK Car Schedule</div><a href="index.html">＋ เพิ่มสถานะรถ</a></nav>
    <h1>ตารางรถทั้งหมด</h1><p class="intro">รถเป็นแถว วันที่เป็นคอลัมน์ — กดรายการเพื่อดูรายละเอียดหรือยกเลิก</p>
    <section class="bar"><button id="prev">‹ สัปดาห์ก่อน</button><div class="range" id="range"></div><button id="next">สัปดาห์ถัดไป ›</button></section>
    <div class="legend"><span class="tag green">ว่าง</span><span class="tag pink">ลูกค้าจอง</span><span class="tag yellow">รอยืนยัน</span><span class="tag blue">ใช้ส่วนตัว</span><span class="tag purple">เข้าอู่ / ซ่อม</span></div>
    <section class="table-wrap"><div class="timeline" id="timeline"></div></section>
  </main>
  <div class="modal" id="modal"><article><h2 id="detailTitle"></h2><p id="detailText"></p><div class="actions"><button class="cancel" id="cancel">ยกเลิกรายการ</button><button class="close" id="close">ปิด</button></div></article></div>
  <script>
    const cars=[['ativ2017','กข 1234','Yaris Ativ 2017'],['ativ2019','ขค 5678','Yaris Ativ 2019'],['ativ2021','งจ 9012','Yaris Ativ 2021'],['ativ2022','ฉช 2468','Yaris Ativ 2022'],['yaris2025','ญษ 5555','Yaris All New 2025']];
    const $=s=>document.querySelector(s);let selected=null;let monday=startOfWeek(new Date());
    function startOfWeek(date){const d=new Date(date);const day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);d.setHours(0,0,0,0);return d}
    function key(date){return new Date(date).toISOString().slice(0,10)}
    function thai(date,withYear=false){return date.toLocaleDateString('th-TH',{day:'numeric',month:'short',...(withYear?{year:'numeric'}:{})})}
    function readEvents(){try{return JSON.parse(localStorage.getItem('kk-car-events')||'[]')}catch(error){try{return JSON.parse(window.name||'[]')}catch(ignore){return []}}}
    function writeEvents(list){try{localStorage.setItem('kk-car-events',JSON.stringify(list))}catch(error){window.name=JSON.stringify(list)}}
    function events(){return readEvents().filter(x=>x.active!==false)}
    function inDay(event,date){const d=key(date);return event.startDate<=d&&event.endDate>=d}
    function render(){const days=Array.from({length:7},(_,i)=>{const d=new Date(monday);d.setDate(d.getDate()+i);return d});$('#range').textContent=thai(days[0],true)+' – '+thai(days[6],true);const html=['<div class="head">ทะเบียนรถ</div>',...days.map(d=>`<div class="head">${['จ.','อ.','พ.','พฤ.','ศ.','ส.','อา.'][(d.getDay()+6)%7]}<small>${thai(d)}</small></div>`),...cars.flatMap(car=>{const cells=[`<div class="car">🚗 <div>${car[1]}<small>${car[2]}</small></div></div>`];days.forEach(day=>{const active=events().filter(e=>e.carId===car[0]&&inDay(e,day));cells.push(`<div class="day">${active.length?active.map(e=>`<button class="event" data-id="${e.id}" data-status="${e.status}"><b>${e.status}</b><small>${e.allDay?'ทั้งวัน':e.startTime+'–'+e.endTime}${e.note?' · '+e.note:''}</small></button>`).join(''):'<span class="free">ว่าง</span>'}</div>`)});return cells})];$('#timeline').innerHTML=html.join('');document.querySelectorAll('.event').forEach(button=>button.onclick=()=>openDetail(events().find(e=>e.id===button.dataset.id)))}
    function openDetail(item){selected=item;const car=cars.find(c=>c[0]===item.carId);$('#detailTitle').textContent='🚗 '+car[1]+' — '+item.status;$('#detailText').innerHTML=`${item.startDate} ถึง ${item.endDate}<br>${item.allDay?'ไม่ว่างทั้งวัน':item.startTime+'–'+item.endTime}${item.note?'<br>หมายเหตุ: '+item.note:''}`;$('#modal').classList.add('show')}
    $('#close').onclick=()=>$('#modal').classList.remove('show');$('#cancel').onclick=()=>{if(!selected)return;const list=readEvents();const index=list.findIndex(x=>x.id===selected.id);list[index].active=false;list[index].status='cancelled';writeEvents(list);$('#modal').classList.remove('show');render()};$('#prev').onclick=()=>{monday.setDate(monday.getDate()-7);render()};$('#next').onclick=()=>{monday.setDate(monday.getDate()+7);render()};render();
  </script>
</body>
</html>
