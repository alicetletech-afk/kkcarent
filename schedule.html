<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KK Car Schedule — ตารางรถ</title>
  <style>
  
:root{--ink:#173a35;--muted:#69827d;--teal:#16967f;--mint:#dff7ef;--pink:#ffe0e8;--yellow:#fff2b8;--blue:#ddecff;--purple:#eee2ff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(135deg,#ebfbf7,#e8f2ff);color:var(--ink);font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
a{color:inherit}

  main{max-width:1180px;margin:auto;padding:26px 22px 50px}
  .nav{display:flex;justify-content:space-between;align-items:center;gap:14px}
  .brand{font-size:18px;font-weight:850}
  .nav a{background:#fff;color:#177763;font-weight:800;text-decoration:none;padding:11px 15px;border-radius:14px;box-shadow:0 8px 20px #1a514015}
  h1{font-size:30px;margin:26px 0 5px}
  .intro{margin:0 0 18px;color:var(--muted)}
  .bar{background:#fff;padding:14px;border-radius:20px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 12px 34px #194c4014}
  .bar button{border:0;background:#eaf7f3;color:#167b69;padding:10px 13px;border-radius:12px;font:inherit;font-weight:800;cursor:pointer}
  .range{font-weight:800;text-align:center}
  .legend{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0}
  .tag{padding:7px 10px;border-radius:99px;font-weight:750;font-size:13px}
  .pink{background:#ffe0e8}.yellow{background:#fff2b8}.blue{background:#ddecff}.purple{background:#eee2ff}.green{background:#dff7ef}
  .table-wrap{overflow:auto;background:#fff;border-radius:24px;box-shadow:0 12px 34px #194c4014}
  .timeline{min-width:940px;display:grid;grid-template-columns:150px repeat(7,1fr);border-top:1px solid #e4efed;border-left:1px solid #e4efed}
  .head,.car,.day{min-height:100px;border-right:1px solid #e4efed;border-bottom:1px solid #e4efed;padding:12px}
  .head{background:#f7fcfb;font-weight:850;text-align:center}
  .head small{display:block;color:var(--muted);font-weight:600;margin-top:4px}
  .car{display:flex;align-items:center;gap:7px;font-weight:850;background:#fcfffe}
  .car small{display:block;color:var(--muted);font-weight:550}
  .day{padding:8px;background:linear-gradient(180deg,#fff,#fbfefd)}
  .free{display:block;color:#4b8676;font-size:12px;padding:7px 8px;border-radius:10px;background:#f0faf6}
  .event{display:block;width:100%;border:0;border-radius:11px;padding:8px;margin:0 0 6px;text-align:left;font:inherit;font-size:12px;color:#243b37;cursor:pointer}
  .event b{display:block}
  .event small{display:block;margin-top:3px;opacity:.78}
  .event[data-status="ลูกค้าจอง"]{background:var(--pink)}
  .event[data-status="รอยืนยัน"]{background:var(--yellow)}
  .event[data-status="ใช้ส่วนตัว"]{background:var(--blue)}
  .event[data-status="เข้าอู่ / ซ่อม"]{background:var(--purple)}
  .modal{position:fixed;inset:0;display:none;place-items:center;padding:18px;background:#10231d88}
  .modal.show{display:grid}
  .modal article{width:min(430px,100%);padding:26px;border-radius:25px;background:white}
  .modal h2{margin:0 0 10px}
  .modal p{color:var(--muted);line-height:1.55}
  .actions{display:flex;gap:10px;margin-top:18px}
  .actions button{flex:1;border:0;padding:12px;border-radius:13px;font:inherit;font-weight:800;cursor:pointer}
  .cancel{background:#fbe2e8;color:#a33f56}
  .close{background:#e9f6f2;color:#167b69}
  .loading{padding:35px;text-align:center;color:var(--muted)}
  </style>
</head>
<body>
<main>
  <nav class="nav">
    <div class="brand">🚙 KK Car Schedule</div>
    <a href="index.html">＋ เพิ่มสถานะรถ</a>
  </nav>

  <h1>ตารางรถทั้งหมด</h1>
  <p class="intro">รถเป็นแถว วันที่เป็นคอลัมน์ — กดรายการเพื่อดูรายละเอียดหรือลบ</p>

  <section class="bar">
    <button id="prev">‹ สัปดาห์ก่อน</button>
    <div class="range" id="range"></div>
    <button id="next">สัปดาห์ถัดไป ›</button>
  </section>

  <div class="legend">
    <span class="tag green">ว่าง</span>
    <span class="tag pink">ลูกค้าจอง</span>
    <span class="tag yellow">รอยืนยัน</span>
    <span class="tag blue">ใช้ส่วนตัว</span>
    <span class="tag purple">เข้าอู่ / ซ่อม</span>
  </div>

  <section class="table-wrap">
    <div class="timeline" id="timeline">
      <div class="loading">กำลังโหลดตารางรถ...</div>
    </div>
  </section>
</main>

<div class="modal" id="modal">
  <article>
    <h2 id="detailTitle"></h2>
    <p id="detailText"></p>
    <div class="actions">
      <button class="cancel" id="cancel">ลบรายการ</button>
      <button class="close" id="close">ปิด</button>
    </div>
  </article>
</div>

<script>

const API_URL = 'https://script.google.com/macros/s/AKfycbzb-ZtwopacvCf2KivTTj23bj1u2dh4PTo7BT92wiLGlO-mhOkWk9PBip5YYASBbJc4MQ/exec';

function apiCall(params) {
  return new Promise((resolve, reject) => {
    const callbackName =
      '__kkcb_' + Date.now() + '_' + Math.random().toString(36).slice(2);

    const timeout = setTimeout(() => {
      cleanup();
      reject(new Error('เชื่อมต่อระบบไม่สำเร็จ กรุณาลองใหม่'));
    }, 20000);

    function cleanup() {
      clearTimeout(timeout);
      delete window[callbackName];
      if (script.parentNode) script.parentNode.removeChild(script);
    }

    window[callbackName] = function (response) {
      cleanup();

      if (!response || response.ok === false) {
        reject(new Error(
          response && response.error
            ? response.error
            : 'เกิดข้อผิดพลาด'
        ));
        return;
      }

      resolve(response);
    };

    const query = new URLSearchParams({
      ...params,
      callback: callbackName,
      _: String(Date.now())
    });

    const script = document.createElement('script');
    script.src = API_URL + '?' + query.toString();
    script.onerror = function () {
      cleanup();
      reject(new Error('โหลดข้อมูลไม่สำเร็จ'));
    };

    document.body.appendChild(script);
  });
}


const $ = selector => document.querySelector(selector);
let cars = [];
let events = [];
let selected = null;
let monday = startWeek(new Date());

function startWeek(date) {
  const result = new Date(date);
  result.setDate(result.getDate() - ((result.getDay() + 6) % 7));
  result.setHours(0, 0, 0, 0);
  return result;
}

function key(date) {
  const year = date.getFullYear();
  const month = String(date.getMonth() + 1).padStart(2, '0');
  const day = String(date.getDate()).padStart(2, '0');
  return `${year}-${month}-${day}`;
}

function text(date, year = false) {
  return date.toLocaleDateString('th-TH', {
    day: 'numeric',
    month: 'short',
    ...(year ? { year: 'numeric' } : {})
  });
}

function inDay(event, date) {
  const dateKey = key(date);
  return (
    event.startAt.slice(0, 10) <= dateKey &&
    event.endAt.slice(0, 10) >= dateKey
  );
}

function render() {
  const days = Array.from({ length: 7 }, (_, index) => {
    const date = new Date(monday);
    date.setDate(date.getDate() + index);
    return date;
  });

  $('#range').textContent =
    text(days[0], true) + ' – ' + text(days[6], true);

  let html =
    '<div class="head">ทะเบียนรถ</div>' +
    days.map(date => `
      <div class="head">
        ${['จ.','อ.','พ.','พฤ.','ศ.','ส.','อา.'][(date.getDay() + 6) % 7]}
        <small>${text(date)}</small>
      </div>
    `).join('');

  cars.forEach(car => {
    html += `
      <div class="car">
        🚗
        <div>
          ${escapeHtml(car.label)}
          <small>${escapeHtml(car.id)}</small>
        </div>
      </div>
    `;

    days.forEach(day => {
      const list = events.filter(event =>
        event.carId === car.id && inDay(event, day)
      );

      html += `
        <div class="day">
          ${list.length
            ? list.map(event => `
                <button
                  class="event"
                  data-id="${escapeHtml(event.id)}"
                  data-status="${escapeHtml(event.status)}"
                >
                  <b>${escapeHtml(event.status)}</b>
                  <small>
                    ${event.allDay
                      ? 'ทั้งวัน'
                      : event.startAt.slice(11, 16) + '–' + event.endAt.slice(11, 16)
                    }
                    ${event.note ? ' · ' + escapeHtml(event.note) : ''}
                  </small>
                </button>
              `).join('')
            : '<span class="free">ว่าง</span>'
          }
        </div>
      `;
    });
  });

  $('#timeline').innerHTML = html;

  document.querySelectorAll('.event').forEach(button => {
    button.onclick = () => {
      const event = events.find(item => item.id === button.dataset.id);
      openEvent(event);
    };
  });
}

function openEvent(event) {
  selected = event;
  const car = cars.find(item => item.id === event.carId);

  $('#detailTitle').textContent =
    '🚗 ' + (car ? car.label : event.carId) + ' — ' + event.status;

  $('#detailText').innerHTML =
    `${event.startAt.slice(0, 10)} ถึง ${event.endAt.slice(0, 10)}<br>` +
    `${event.allDay
      ? 'ไม่ว่างทั้งวัน'
      : event.startAt.slice(11, 16) + '–' + event.endAt.slice(11, 16)
    }` +
    `${event.note ? '<br>หมายเหตุ: ' + escapeHtml(event.note) : ''}`;

  $('#modal').classList.add('show');
}

async function load() {
  try {
    const data = await apiCall({ action: 'initial' });
    cars = data.cars || [];
    events = data.events || [];
    render();
  } catch (error) {
    alert(error.message || error);
  }
}

$('#close').onclick = () => $('#modal').classList.remove('show');

$('#cancel').onclick = async () => {
  if (!selected) return;

  const deleteButton = $('#cancel');
  const recordId = selected.id;

  deleteButton.disabled = true;
  deleteButton.textContent = 'กำลังลบ…';

  try {
    await apiCall({
      action: 'delete',
      recordId: recordId
    });

    // เอาออกจากข้อมูลในหน้าเว็บทันที ไม่ต้องรอรีเฟรชจาก API
    events = events.filter(item => item.id !== recordId);
    render();

    $('#modal').classList.remove('show');
    selected = null;
  } catch (error) {
    alert(error.message || error);
  } finally {
    deleteButton.disabled = false;
    deleteButton.textContent = 'ลบรายการ';
  }
};

$('#prev').onclick = () => {
  monday.setDate(monday.getDate() - 7);
  render();
};

$('#next').onclick = () => {
  monday.setDate(monday.getDate() + 7);
  render();
};

function escapeHtml(value) {
  return String(value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

load();
</script>
</body>
</html>
