<style>:root{--ink:#173a35;--muted:#69827d;--teal:#16967f;--mint:#dff7ef;--pink:#ffe0e8;--yellow:#fff2b8;--blue:#ddecff;--purple:#eee2ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#ebfbf7,#e8f2ff);color:var(--ink);font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{width:min(760px,100%);margin:auto;padding:28px 20px 50px}.nav{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:800}.nav a{background:#fff;color:#177763;font-weight:800;text-decoration:none;padding:11px 15px;border-radius:14px;box-shadow:0 8px 20px #1a514015}h1{font-size:clamp(28px,5vw,38px);margin:28px 0 6px}.intro{color:var(--muted);margin:0 0 22px}.card{background:#fff;border-radius:24px;padding:21px;margin:16px 0;box-shadow:0 12px 34px #194c4014}h2{margin:0 0 14px;font-size:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px}.choice{width:100%;border:2px solid #e4efed;background:#fff;border-radius:17px;padding:14px;color:var(--ink);text-align:left;font:inherit;cursor:pointer}.choice.active{border-color:var(--teal);background:var(--mint);box-shadow:0 4px 12px #149b8130}.choice small{display:block;margin-top:5px;color:var(--muted)}.status[data-status="ลูกค้าจอง"]{background:var(--pink)}.status[data-status="รอยืนยัน"]{background:var(--yellow)}.status[data-status="ใช้ส่วนตัว"]{background:var(--blue)}.status[data-status="เข้าอู่ / ซ่อม"]{background:var(--purple)}label{display:block;font-size:14px;font-weight:800;margin-top:14px}input,textarea{display:block;width:100%;margin-top:6px;padding:13px;border:1px solid #d9e7e4;border-radius:14px;font:inherit;color:var(--ink);background:#fcfefd}.dates{display:grid;grid-template-columns:1fr 1fr;gap:12px}.toggle{display:flex;align-items:center;gap:9px;background:#edf8f5;padding:12px;border-radius:14px;cursor:pointer}.toggle input{width:20px;height:20px;margin:0;accent-color:var(--teal)}.save{width:100%;border:0;border-radius:16px;padding:16px;margin-top:20px;background:var(--teal);color:#fff;font:inherit;font-weight:800;font-size:17px;cursor:pointer}.save:disabled{opacity:.65}.modal{position:fixed;inset:0;display:none;place-items:center;padding:18px;background:#10231d88}.modal.show{display:grid}.modal article{width:min(480px,100%);padding:28px;border-radius:26px;background:#fff;text-align:center}.modal h2{font-size:25px;margin:10px 0 8px}.modal p{color:var(--muted);line-height:1.6}.modal a,.modal button{display:block;width:100%;border:0;border-radius:15px;padding:14px;margin-top:10px;font:inherit;font-weight:800;text-decoration:none;cursor:pointer}.modal a{background:var(--teal);color:#fff}.modal button{background:#eaf6f3;color:#167b69}@media(max-width:460px){.dates{grid-template-columns:1fr}main{padding:22px 16px 40px}}</style></head>
<body><main><nav class="nav"><div class="brand">🚙 KK Car Schedule</div><a href="?page=schedule">ดูตารางรถ →</a></nav><h1>เพิ่มสถานะรถ</h1><p class="intro">เลือกทะเบียน สถานะ วันและเวลา แล้วตารางรถจะอัปเดตทันที</p><form id="form"><section class="card"><h2>1. เลือกรถ</h2><div class="grid" id="cars"></div></section><section class="card"><h2>2. เลือกสถานะ</h2><div class="grid"><button type="button" class="choice status" data-status="ลูกค้าจอง">🩷 ลูกค้าจอง</button><button type="button" class="choice status" data-status="รอยืนยัน">💛 รอยืนยัน</button><button type="button" class="choice status" data-status="ใช้ส่วนตัว">💙 ใช้ส่วนตัว</button><button type="button" class="choice status" data-status="เข้าอู่ / ซ่อม">💜 เข้าอู่ / ซ่อม</button></div></section><section class="card"><h2>3. วันและเวลา</h2><label class="toggle"><input id="allDay" type="checkbox" checked> ไม่ว่างทั้งวัน</label><div class="dates"><label>เริ่ม<input id="startDate" type="date" required></label><label>สิ้นสุด<input id="endDate" type="date" required></label></div><div class="dates" id="timeFields" hidden><label>เวลาเริ่ม<input id="startTime" type="time" value="08:00"></label><label>เวลาสิ้นสุด<input id="endTime" type="time" value="18:00"></label></div><label>หมายเหตุ <span style="font-weight:500;color:#78908b">(ไม่บังคับ)</span><textarea id="note" rows="2" placeholder="ชื่อลูกค้า / งาน / รายละเอียด"></textarea></label><button class="save" id="save">บันทึกสถานะรถ</button></section></form></main><div class="modal" id="modal"><article><div style="font-size:48px">✅</div><h2>บันทึกเรียบร้อย</h2><p id="summary"></p><a href="?page=schedule">ดูตารางรถทั้งหมด</a><button type="button" id="again">เพิ่มรายการต่อ</button></article></div>
<script>
const $=s=>document.querySelector(s);let cars=[],selectedCar='',selectedStatus='';const today=new Date().toISOString().slice(0,10);$('#startDate').value=$('#endDate').value=today;const pick=(el,selector)=>{document.querySelectorAll(selector).forEach(x=>x.classList.remove('active'));el.classList.add('active')};const fail=e=>alert((e&&e.message)||e||'เกิดข้อผิดพลาด');
function setup(data){cars=data.cars||[];$('#cars').innerHTML=cars.map(c=>`<button type="button" class="choice car" data-id="${c.id}">🚗 ${c.label}<small>${c.id}</small></button>`).join('');document.querySelectorAll('.car').forEach(b=>b.onclick=()=>{selectedCar=b.dataset.id;pick(b,'.car')});document.querySelectorAll('.status').forEach(b=>b.onclick=()=>{selectedStatus=b.dataset.status;pick(b,'.status')})}
$('#allDay').onchange=e=>$('#timeFields').hidden=e.target.checked;$('#form').onsubmit=e=>{e.preventDefault();if(!selectedCar||!selectedStatus)return alert('กรุณาเลือกรถและสถานะ');const button=$('#save');button.disabled=true;button.textContent='กำลังบันทึก…';google.script.run.withSuccessHandler(()=>{const car=cars.find(c=>c.id===selectedCar);$('#summary').textContent=`${car.label} · ${selectedStatus}`;$('#modal').classList.add('show');button.disabled=false;button.textContent='บันทึกสถานะรถ'}).withFailureHandler(error=>{button.disabled=false;button.textContent='บันทึกสถานะรถ';fail(error)}).saveAvailability({carId:selectedCar,status:selectedStatus,startDate:$('#startDate').value,endDate:$('#endDate').value,startTime:$('#startTime').value,endTime:$('#endTime').value,allDay:$('#allDay').checked,note:$('#note').value})};$('#again').onclick=()=>location.reload();google.script.run.withSuccessHandler(setup).withFailureHandler(fail).getInitialData();
</script></body></html>
